<!DOCTYPE html>
<html>
     <title>student registration and feedback</title>
     <head>
     <style>
     body{
        background-color: rgb(112, 116, 114);
        text-align: center;
     }
     .studentform {
    padding: 20px;                     
    border: 4px solid rgb(12, 0, 14);  
    border-radius: 10px;         
    text-align: center;                
  }
  
     </style>
     </head>
    <body>

        <div class = "studentform" style = "background-color: rgb(54, 55, 55); padding: 20px; border-radius: 10px;">
            <center>
            <h1>Student Information System</h1>
            <p>please fill the form below</p>
            </center>
        </div>
        <form action = "/-submit.com" method = "post">
            <center>
            <div class = "section 1">
              <h3>1. Personal Details</h3><br>
              <label for = "name">Enter Name:</label><br>
              <input type = "text" id = "name"  placeholder = "enter your name" required><br><br>
              <label for = "register">Enter Registration Number:</label><br>
              <input type = "text" id = "register"  placeholder = "enter your registration number" required><br><br>
              <label for = "department">Enter Department:</label><br>
              <select id = "department" required>
                <option value = "ECE">ECE</option>
                <option value = "CSE">CSE</option>
                <option value = "IT">IT</option>
                <option value = "AIDS">AIDS</option>
              </select><br><br>
              <label for = "DOB">Enter DOB:</label><br>
              <input type = "date" id = "DOB"  placeholder = "enter your date of birth" required><br><br>
              <label for = "accomodate">Enter Accommodation Details:</label><br>
              <input type = "text" id = "accomodate"  placeholder = "enter your accommodation details" required><br><br>
              <input type = "checkbox">
              <label for = "accomodate" >HOSTELLER <br>
                <input type = "checkbox">
              <label for = "day_scholar">DAY SCHOLAR <br>
               <style> form {
    padding: 10px;                     
    border: 4px solid rgb(1, 0, 2);  
    border-radius: 5px;         
    text-align: left;                  
               }</style>
</div>
            <div class = "section 2">
           <h3>2. Address</h3>
           <label for = "address">Enter Address:</label><br>
           <input type = "text" id ="address"  placeholder = "enter your address" required><br><br>
            </div>
            <div class = "section 3">

                </div></center>
        </form>
    </body>
</html>
